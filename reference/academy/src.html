<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JSH Training Academy Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
/* One visual world, by choice: the graphite-blue of the JSH AI Workshop Platform, with brass for anything earned.
   Layout idea: a slim campus rail on the left, one working surface on the right; lessons are the unit of everything. */
:root{
  color-scheme: dark;
  --paper:#12181e; --sheet:#1a222a; --raised:#222c36; --line:#2f3b47;
  --ink:#e8edf1; --soft:#9daab6;
  --blue:#6ea8e8;   /* AWP campus accent */
  --brass:#d9b25f;  /* earned: progress, certificates */
  --good:#58c08a; --warn:#e0a94a; --bad:#e8776a;
  --display:'Instrument Serif', Georgia, serif;
  --body:'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.5 var(--body)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.rail{background:#0e1318;border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px}
.brand b{font-family:var(--display);font-weight:400;font-size:24px;line-height:1}
.brand small{display:block;color:var(--soft);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.mark{width:34px;height:34px;border-radius:9px;background:var(--brass);color:#1a1408;display:grid;place-items:center;font-weight:700}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{background:none;border:0;text-align:left;padding:9px 10px;border-radius:8px;color:var(--soft);display:flex;gap:10px;align-items:center}
.nav button:hover{background:var(--sheet);color:var(--ink)}
.nav button.on{background:var(--raised);color:var(--ink);font-weight:600}
.nav .lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#6f7d8a;padding:10px 10px 4px}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.soon{margin-left:auto;font-size:11px;border:1px solid var(--line);border-radius:10px;padding:0 7px;color:#7f8c98}
.who{margin-top:auto;border-top:1px solid var(--line);padding:14px 6px 0;font-size:14px;color:var(--soft)}
.who select{width:100%;margin-top:6px;background:var(--sheet);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px}
main{padding:28px clamp(16px,4vw,44px) 60px;min-width:0}
.wrap{max-width:1060px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,5vw,48px);line-height:1.08;margin:4px 0 6px}
.lead{color:var(--soft);max-width:62ch;margin:0}
.grid{display:grid;gap:16px}
.box{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:20px}
.box h2{font-size:18px;font-weight:600;margin-bottom:12px}
.btn{background:var(--blue);color:#0d1620;border:0;border-radius:9px;padding:11px 18px;font-weight:700}
.btn.ghost{background:none;color:var(--blue);border:1px solid var(--blue)}
.btn.quiet{background:none;color:var(--blue);padding:6px 0;font-weight:600}
.btn.brass{background:var(--brass);color:#1a1408}
.meter{height:8px;background:var(--line);border-radius:5px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--brass);border-radius:5px;transition:width .5s}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;border-radius:20px;padding:2px 10px;border:1px solid var(--line);color:var(--soft);white-space:nowrap}
.pill.good{border-color:var(--good);color:var(--good)} .pill.warn{border-color:var(--warn);color:var(--warn)} .pill.bad{border-color:var(--bad);color:var(--bad)} .pill.blue{border-color:var(--blue);color:var(--blue)}
/* home */
.resume{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:center;background:linear-gradient(135deg,#1d2a38,#1a222a);border-color:#38506a}
.resume h2{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.15;margin:6px 0 10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{background:var(--raised);border-radius:12px;padding:14px}
.stat b{display:block;font-size:26px;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--soft)}
.campus{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.camp{background:var(--raised);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:150px}
.camp:disabled{opacity:.62;cursor:default}
.camp b{font-size:17px}
.camp .pill{align-self:flex-start}
.camp p{margin:0;font-size:14px;color:var(--soft)}
.camp .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px 10px;font-size:13px;color:var(--soft)}
/* path */
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.mod{background:var(--sheet);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.mod .art{height:96px;background:#141c24;border-bottom:1px solid var(--line);position:relative;overflow:hidden}
.mod .body{padding:16px;display:flex;flex-direction:column;gap:10px;flex:1}
.mod h3{font-size:17px}
.mod .n{font-size:12px;color:var(--soft);letter-spacing:.1em;text-transform:uppercase}
.les{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.les button{width:100%;background:none;border:0;border-top:1px solid var(--line);padding:9px 0;display:flex;gap:10px;align-items:center;text-align:left;font-size:15px}
.les button:hover span.t{color:var(--blue)}
.les .d{margin-left:auto;font-size:13px;color:var(--soft);font-variant-numeric:tabular-nums}
.chk{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:11px;color:#1a1408}
.chk.done{background:var(--brass);border-color:var(--brass)}
.chk.next{border-color:var(--blue);box-shadow:0 0 0 3px #6ea8e833}
@keyframes drift{0%{transform:translateX(-12px)}50%{transform:translateX(12px)}100%{transform:translateX(-12px)}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes rise{0%{transform:translateY(10px);opacity:0}30%,80%{transform:none;opacity:1}100%{opacity:0}}
.art svg{width:100%;height:100%}
.a-drift{animation:drift 6s ease-in-out infinite} .a-pulse{animation:pulse 2.4s ease-in-out infinite} .a-rise{animation:rise 4s ease-in-out infinite}
/* lesson */
.lesson{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:20px;align-items:start}
.player{background:#0b1015;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.stage{aspect-ratio:16/9;position:relative;background:#141a20;overflow:hidden}
.cap{padding:12px 18px;background:#0b1015;border-top:1px solid var(--line);font-size:16px;text-align:center;min-height:50px;color:var(--ink)}
.bar{display:flex;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.bar .track{flex:1;height:6px;background:var(--line);border-radius:4px;overflow:hidden}
.bar .track i{display:block;height:100%;width:0;background:var(--blue)}
.bar button{background:var(--blue);color:#0d1620;border:0;border-radius:50%;width:38px;height:38px;font-weight:700}
.bar .tm{font-size:13px;color:var(--soft);font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--soft);padding:8px 14px 12px}
/* mock AWP screen inside the player */
.awp{position:absolute;inset:0;padding:4.5% 7%;font-size:clamp(9px,1.25vw,14px);line-height:1.45}
.awp .t{font-family:var(--display);font-size:2.5em;line-height:1.1}
.awp .row{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:.7em 0}
.awp .tag{border:1px solid var(--line);border-radius:4px;font-size:.8em;padding:0 .5em;margin-left:.6em;color:var(--soft)}
.awp .b{display:inline-block;background:var(--blue);color:#0d1620;font-weight:700;border-radius:.45em;padding:.55em 1em}
.awp .f{display:block;margin:.55em 0 0;color:var(--soft);font-size:.9em}
.awp .in{display:block;background:#0f151b;border:1px solid var(--line);border-radius:.4em;padding:.5em .7em;color:var(--ink);min-height:2.4em;margin-top:.2em}
.awp .hl{outline:3px solid var(--brass);outline-offset:4px;border-radius:.5em;animation:pulse 1.6s ease-in-out infinite}
.awp .voices{display:grid;grid-template-columns:repeat(3,1fr);gap:1em;margin-top:1.2em}
.awp .voice{background:var(--sheet);border:1px solid var(--line);border-radius:.7em;padding:1em}
.side{display:flex;flex-direction:column;gap:16px}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.opts button{background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left}
.opts button.right{border-color:var(--good);background:#1d3329} .opts button.wrong{border-color:var(--bad);background:#35211f}

.tabs2{display:flex;gap:4px;padding:8px 12px 0;border-bottom:1px solid var(--line)}
.tabs2 button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 14px;color:var(--soft);font-weight:600}
.tabs2 button.on{color:var(--ink);border-color:var(--brass)}
.sim{background:#12181e;padding:20px 24px 26px;min-height:470px;font-size:15px}
.sim .top{display:flex;justify-content:space-between;align-items:center;color:var(--soft);font-size:13px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:16px}
.sim .top b{font-family:var(--display);font-weight:400;font-size:19px;color:var(--ink)}
.sim h3{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.15;margin:8px 0 4px}
.sim .er{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding:11px 2px}
.sim .er small{display:block;color:var(--soft)}
.sim .tg{border:1px solid var(--line);border-radius:5px;font-size:12px;padding:0 6px;margin-left:8px;color:var(--soft)}
.sim label{display:block;color:var(--ink);font-size:14px;margin-top:13px}
.sim label small,.sim .mut{color:var(--soft);font-size:13px}
.sim input[type=text],.sim input[type=email],.sim textarea{display:block;width:100%;background:#0f151b;border:1px solid var(--line);border-radius:8px;padding:9px 11px;color:var(--ink);font:inherit;margin-top:5px}
.sim .pre{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:16px;background:#151c23}
.sim .pre label.c{display:flex;gap:10px;align-items:flex-start;margin:0}
.sim .pre input[type=checkbox]{width:18px;height:18px;margin-top:3px;accent-color:#6ea8e8}
.sim .pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sim .btn:disabled{opacity:.45;cursor:not-allowed}
.sim .link{background:none;border:0;color:var(--blue);padding:0;font-weight:600}
.sim .target{outline:3px solid var(--brass);outline-offset:4px;border-radius:9px;animation:ring 1.6s ease-in-out infinite}
@keyframes ring{0%,100%{outline-color:#d9b25f}50%{outline-color:rgba(217,178,95,.35)}}
@media (prefers-reduced-motion:reduce){.sim .target{animation:none}}
.pnow{padding:9px 14px;border-bottom:1px solid var(--line);background:var(--raised);font-size:14px;color:var(--ink)}
.pnow b{color:var(--brass)}
.box.sticky{position:sticky;top:12px;z-index:2}
@media (max-width:900px){.box.sticky{position:static}}
.sim .v3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.sim .v3 div{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:13px;color:var(--soft)}
.sim .v3 b{display:block;color:var(--ink);font-size:14px;margin-bottom:3px}
.sim .okbox{border:1px solid var(--good);background:#1d3329;border-radius:12px;padding:14px 16px;margin-top:16px}
.sim .prog{display:flex;gap:10px;align-items:center;margin-top:16px;color:var(--ink)}
.sim .prog i{width:10px;height:10px;border-radius:50%;background:var(--blue);animation:pulse 1s ease-in-out infinite}
.simbar{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 14px;border-top:1px solid var(--line);font-size:13px;color:var(--soft)}
.steps.live{list-style:none;padding:0;gap:6px}
.steps.live li{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:10px;border:1px solid transparent;color:var(--soft)}
.steps.live li.cur{border-color:var(--brass);background:var(--raised);color:var(--ink)}
.steps.live li.ok{color:var(--ink)}
.steps.live .n{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:12px;font-weight:700;margin-top:1px}
.steps.live li.ok .n{background:var(--good);border-color:var(--good);color:#0d1620}
.steps.live li.cur .n{border-color:var(--brass);color:var(--brass)}
@media (max-width:900px){.sim .pair,.sim .v3{grid-template-columns:1fr}}
.starthere{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:22px;align-items:center}
@media (max-width:900px){.starthere{grid-template-columns:1fr}}
.grid>*{min-width:0}
.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(210px,100%),1fr));gap:12px}
@media (max-width:600px){.camps{grid-template-columns:1fr}}
.doors div{background:var(--raised);border-radius:12px;padding:14px}
.doors b{display:block;margin-bottom:4px}
.doors span{color:var(--soft);font-size:14px}
.camps{grid-column:1/-1;border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin:0;min-width:0}
.camps legend{padding:0 6px;color:var(--soft);font-size:14px}
.form .camps label{display:flex;gap:8px;align-items:center;margin:0;font-size:14px;flex-direction:row;color:var(--ink)}
.form .camps input{width:18px;height:18px;padding:0;accent-color:#6ea8e8}
.form .wide{grid-column:1/-1}
.pwrow{display:flex;gap:8px;max-width:420px}
.pwrow input{min-width:0}
.pwrow input{flex:1;font-family:ui-monospace,monospace}
.vwrap{position:relative}
.upnext{position:absolute;inset:0;background:rgba(11,16,21,.93);display:grid;place-items:center;text-align:center;z-index:3;padding:20px}
.upnext[hidden]{display:none}
.upnext small{display:block;color:var(--soft);letter-spacing:.1em;text-transform:uppercase;font-size:12px}
.upnext b{display:block;font-family:var(--display);font-weight:400;font-size:clamp(22px,3vw,32px);line-height:1.15;margin:6px 0 16px}
.vbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid var(--line);font-size:14px;color:var(--soft)}
.crumbs{display:flex;gap:8px;align-items:center;color:var(--soft);font-size:14px;margin-bottom:8px;flex-wrap:wrap}
.crumbs button{background:none;border:0;color:var(--blue);padding:0}
.rowx{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* in-app help panel + invites */
.inapp{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(260px,1fr);gap:20px;align-items:start}
.screen{background:#141a20;border:1px solid var(--line);border-radius:16px;position:relative;min-height:380px;padding:24px;overflow:hidden}
.screen .t{font-family:var(--display);font-size:30px}
.help{margin:28px 0 0 auto;width:min(340px,100%);background:var(--raised);border:1px solid var(--blue);border-radius:14px;padding:14px;box-shadow:0 12px 40px #0009}
.help h3{font-size:15px;margin-bottom:8px}
.help button.l{display:flex;gap:8px;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:8px 0;text-align:left;font-size:14px}
.help button.l:hover{color:var(--blue)}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.seg button{background:var(--sheet);border:1px solid var(--line);border-radius:20px;padding:6px 14px;color:var(--soft)}
.seg button.on{border-color:var(--blue);color:var(--ink);background:var(--raised)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}
.form label{font-size:13px;color:var(--soft);display:flex;flex-direction:column;gap:4px}
.form input,.form select{background:#0f151b;border:1px solid var(--line);border-radius:8px;padding:9px 10px;color:var(--ink);font:inherit}
.mailp{background:#f4f1ea;color:#1c2126;border-radius:12px;padding:18px;max-width:520px}
.mailp .from{font-size:13px;color:#5d6770;border-bottom:1px solid #d8d3c7;padding-bottom:8px;margin-bottom:10px}
.mailp .cta{display:inline-block;background:#1f3a5f;color:#fff;border-radius:8px;padding:10px 16px;font-weight:700;margin-top:10px}
.rules{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.rules li{display:flex;gap:12px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding:10px 0}
.rules li:first-child{border-top:0}
/* team */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-size:15px}
th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);font-weight:600}
td.num{font-variant-numeric:tabular-nums}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;counter-reset:s}
.flow div{background:var(--raised);border-radius:12px;padding:14px;font-size:14px;color:var(--soft);counter-increment:s}
.flow div b{display:block;color:var(--ink);font-size:15px;margin-bottom:2px}
.flow div::before{content:counter(s);display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--blue);color:#0d1620;font-weight:700;font-size:12px;margin-bottom:8px}
.cert{border:1px solid var(--brass);background:linear-gradient(135deg,#2a2413,#1a222a);display:flex;gap:16px;align-items:center}
.seal{width:64px;height:64px;border-radius:50%;border:2px solid var(--brass);display:grid;place-items:center;color:var(--brass);font-family:var(--display);font-size:26px;flex:none}
.sample{font-size:12px;color:#7f8c98}
@media (max-width:860px){
  .inapp{grid-template-columns:1fr}
  .app{grid-template-columns:1fr}
  .rail{flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 16px;border-right:0;border-bottom:1px solid var(--line)}
  .nav{flex-direction:row;flex-wrap:wrap} .nav .lbl,.nav .camprow{display:none} .who{margin:0;border:0;padding:0}
  .resume,.lesson{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand"><div class="mark">J</div><div><b>Academy</b><small>JSH Innovations</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="who">
      <label for="viewas">Viewing as</label>
      <select id="viewas"></select>
    </div>
  </aside>
  <main><div class="wrap" id="view"></div></main>
</div>
<audio id="vo" preload="auto" src="data:audio/mpeg;base64,__AUDIO__"></audio>
<script>
// ---------- curriculum: written from AWP's own how-to manual (netlify/lib/productDocs.mjs), release R6.1 ----------
const M = [
 {id:'m1', t:'Get in and get around', art:'door', L:[
  {id:'signin', t:'Sign in with your email link', d:'0:20', vid:true, s:['Go to workshop.jshinnovations.com and enter your jshinnovations.com email.','Choose Send link, then open the link in the email.','You stay signed in on that browser. A new device needs one new link.']},
  {id:'list', t:'Read the engagements list', d:'0:23', vid:true, s:['All engagements lists every client engagement with its client, industry and stage.','Tags tell you where the questionnaire stands: to send, sent or back.','A Demo tag marks the practice engagement.']},
  {id:'around', t:'Find your way back', d:'0:20', vid:true, s:['Inside an engagement, All engagements stays at the top as you scroll.','The platform title and the browser Back button also take you home.','Every engagement has its own address, so you can bookmark it.']}]},

function inapp(){
  const sc = SCREENS[inScreen];
  return `
  <div class="eyebrow">The product and the Academy are one system</div>
  <h1 class="h1">Inside the product</h1>
  <p class="lead">Every screen in a JSH product knows which lessons teach it. The ? on the screen opens those lessons right there, and finishing one counts toward the person's path.</p>
  <div class="seg" role="group" aria-label="Screen">${Object.entries(SCREENS).map(([k,v])=>`<button class="${k===inScreen?'on':''}" data-screen="${k}">${v.label}</button>`).join('')}</div>
  <div class="inapp">
   <div class="screen">
    <div class="eyebrow">JSH AI Workshop Platform</div><div class="t">${esc(sc.title)}</div><div style="color:var(--soft)">${esc(sc.sub)}</div>
    <div class="help"><h3>? Learn this screen</h3>
     ${sc.ids.map(id=>{const l=ALL.find(x=>x.id===id);return `<button class="l" data-go="lesson-${id}"><span class="chk ${done.has(id)?'done':''}">${done.has(id)?'✓':''}</span><span>${esc(l.t)}</span><span class="d" style="margin-left:auto;color:var(--soft)">${l.d}</span></button>`}).join('')}
     <button class="l" data-go="path" style="color:var(--blue)">See my whole path</button></div>
   </div>
   <div class="side">
    <div class="box"><h2>How the connection works</h2><ol class="steps">
     <li>Each lesson is tagged with the screen it teaches.</li>
     <li>The product's ? button asks the Academy for that screen's lessons and plays them in a panel, without leaving the page.</li>
     <li>The person's sign-in is shared, so progress lands on their path either way.</li>
     <li>A screen nobody has trained on yet can show a one-time "New here? 60-second tour".</li></ol></div>
    <div class="box"><h2>For MyRealtyVault</h2><p style="margin:0;color:var(--soft)">The same panel sits behind the ? already planned for every screen. An agent on Showings sees the showing lessons; a homeowner on Documents sees the document lessons. Lessons match the person's role, so a homeowner never sees agent training.</p></div>
   </div>
  </div>`;
}
function how(){
  return `
  <div class="eyebrow">Under the hood</div>
  <h1 class="h1">How lessons are made</h1>
  <p class="lead">The Academy runs on the same studio that made the MyRealtyVault promos. A lesson is generated from the product, so it stays true to the product.</p>
  <div class="grid" style="margin-top:20px">
   <div class="box"><h2>From a product task to a lesson</h2><div class="flow">
    <div><b>Source</b>A test case or a section of the product's how-to manual.</div>
    <div><b>Script</b>Steps become scenes. Each step gets one narration line and one caption.</div>
    <div><b>Record</b>A script drives the real app on a demo engagement and records every screen.</div>
    <div><b>Voice</b>The house narration voice reads the script.</div>
    <div><b>Publish</b>Video, written steps, a Try it link and a quick check go live together.</div>
    <div><b>Keep current</b>A release that changes a screen flags its lessons and re-records them.</div>
   </div></div>
   <div class="box"><h2>Where a learner meets a lesson</h2><ul class="steps" style="list-style:disc">
    <li>In the Academy, on a role-based path like this one.</li>
    <li>Inside the product: the ? on a screen opens the lesson for that screen.</li>
    <li>In onboarding emails: the first three lessons for a new user's role.</li></ul></div>
   <div class="box"><h2>What this prototype is</h2><p style="margin:0;color:var(--soft);max-width:70ch">A clickable model of the Academy with the full Workshop Platform curriculum, written from the platform's current how-to manual at release R6.1. One lesson is a real recording with narration. Progress is remembered in this browser only.</p></div>
  </div>`;
}

const mrvOf = h => MRVP.find(P => h===P.key || h.startsWith(P.key+'-'));
MRVP.forEach(P => { P.all = P.mods.flatMap(m => m.L.map(l => ({...l, m}))); P.total = P.all.length; P.done = new Set(); P.seen = new Set();
  try { const s = JSON.parse(localStorage.getItem('jsh-academy-'+P.key+'-done')||'null'); if (Array.isArray(s)) P.done = new Set(s); const q = JSON.parse(localStorage.getItem('jsh-academy-'+P.key+'-seen')||'null'); if (Array.isArray(q)) P.seen = new Set(q); } catch(e){}
  P.save = () => { try { localStorage.setItem('jsh-academy-'+P.key+'-done', JSON.stringify([...P.done])); localStorage.setItem('jsh-academy-'+P.key+'-seen', JSON.stringify([...P.seen])); } catch(e){} };
  P.seq = []; P.mods.forEach(m => { P.seq.push(P.key+'-intro-'+m.id); m.L.forEach(l => P.seq.push(P.key+'-l-'+l.id)); }); P.seq.push(P.key+'-wrap');
  P.title = h => h===P.key+'-wrap' ? 'Wrap-up: congratulations' : h.startsWith(P.key+'-intro-') ? `Module ${P.mods.findIndex(m=>m.id===h.slice(P.key.length+7))+1} intro: ${P.mods.find(m=>m.id===h.slice(P.key.length+7)).t}` : P.all.find(l=>l.id===h.slice(P.key.length+3)).t;
  P.modDone = m => P.seen.has(m.id) && m.L.every(l => P.done.has(l.id));
  P.next = () => { for (const m of P.mods) { if (!P.seen.has(m.id)) return P.key+'-intro-'+m.id; const l = m.L.find(l=>!P.done.has(l.id)); if (l) return P.key+'-l-'+l.id; } return null; };
  P.up = cur => { const i = P.seq.indexOf(cur), nx = P.seq[i+1]; if (!nx) return {over:'', bar:''};
    return {over:`<div class="upnext" id="upnext" hidden><div><small>Up next</small><b>${esc(P.title(nx))}</b><div class="rowx" style="justify-content:center"><button class="btn" data-next="${nx}">Play next</button><button class="btn ghost" id="replay">Replay</button></div></div></div>`,
            bar:`<div class="vbar"><span>${i+1} of ${P.seq.length} in the path</span><button class="btn quiet" data-next="${nx}" style="padding:2px 0">Next: ${esc(P.title(nx))} ▸</button></div>`}; };
  P.vid = (key, up) => `<div class="vwrap"><video controls playsinline preload="none" poster="${P.key}-${key}.jpg" src="${P.key}-${key}.mp4" style="display:block;width:100%;aspect-ratio:16/9;background:#0b1015"></video>${up.over}</div>${up.bar}`; });

   <div><b>Instructor-led</b><span>A brokerage's trainer, or a JSH instructor, runs the Agent path as a class and sees the group's progress.</span></div>
   <div><b>Completing a lesson</b><span>Watch it, try it in the app, then answer the quick check. Each module starts with its intro.</span></div>
   <div><b>Where the films come from</b><span>Every screen is the real app, signed in as ${P.who}. The people and homes are made up.</span></div></div></div>`;
}
function mrvView(h){
  const P = mrvOf(h); if (!P) return home(); const K = P.key;
  if (h===K) return mrvPath(P);
  const crumbs = (mid, pill) => `<div class="crumbs"><button data-go="${K}">${P.name}</button><span>/</span><span>${mid}</span>${pill}</div>`;
  if (h===K+'-wrap') return `${crumbs('Module '+P.mods.length,'<span class="pill good">Wrap-up</span>')}
  <h1 class="h1" style="font-size:clamp(28px,4vw,38px)">Congratulations</h1>
  <div class="lesson" style="margin-top:16px"><div class="player">${P.vid('wrap',{over:'',bar:''})}<div class="note">Plays after the last lesson of the path.</div></div>
   <div class="side"><div class="box"><h2>${P.wrapH}</h2><p style="margin:0;color:var(--soft)">${P.wrapP}</p></div>
    <div class="box"><h2>What's next for you</h2><p style="margin:0 0 12px;color:var(--soft)">${P.done.size>=P.total ? 'Every lesson is complete.' : `You have ${P.total-P.done.size} lessons left on the path.`}</p><button class="btn" data-go="${K}">Back to the path</button></div></div></div>`;
  if (h.startsWith(K+'-intro-')) { const mid = h.slice(K.length+7), i = P.mods.findIndex(m=>m.id===mid); if (i<0) return mrvPath(P); const m = P.mods[i], first = m.L.find(l=>!P.done.has(l.id)) || m.L[0];
    return `${crumbs('Module '+(i+1), `<span class="pill ${P.seen.has(m.id)?'good':''}">${P.seen.has(m.id)?'Intro watched ✓':'Start here'}</span>`)}
  <h1 class="h1" style="font-size:clamp(28px,4vw,38px)">${esc(m.t)}</h1>
  <div class="lesson" style="margin-top:16px"><div class="player">${P.vid('intro-'+m.id, P.up(h))}<div class="note">What this module is for and what you'll be able to do by the end. Watch this first: it's part of the module.</div></div>
   <div class="side"><div class="box"><h2>In this module</h2><ol class="steps">${m.L.map(l=>`<li>${esc(l.t)} <span style="color:var(--soft)">· ${l.d}</span></li>`).join('')}</ol></div>
    <div class="rowx"><button class="btn" data-next="${K}-l-${first.id}">Start: ${esc(first.t)}</button></div></div></div>`; }
  const l = P.all.find(x=>x.id===h.slice(K.length+3)); if (!l) return mrvPath(P); const nx = P.seq[P.seq.indexOf(h)+1];
  return `${crumbs(esc(l.m.t),'')}
  <h1 class="h1" style="font-size:clamp(28px,4vw,38px)">${esc(l.t)}</h1>
  <div class="lesson" style="margin-top:16px"><div class="player">${P.vid('l-'+l.id, P.up(h))}<div class="note">Recorded from MyRealtyVault itself. The phone on the left is the real screen; the window on the right zooms in on each step.</div></div>
   <div class="side"><div class="box"><h2>Steps</h2><ol class="steps">${l.s.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></div>
    <div class="box"><h2>Try it</h2><p style="margin:0;color:var(--soft)">${P.tryit} Practice inside the Academy arrives for this campus next.</p></div>
    <div class="box" id="mquiz"><h2>Quick check</h2><div>${esc(l.q.q)}</div><div class="opts">${l.q.o.map((o,k)=>`<button data-mopt="${k}">${esc(o)}</button>`).join('')}</div><p id="mwhy" style="margin:10px 0 0;color:var(--soft)"></p></div>
    <div class="rowx">${P.done.has(l.id) ? `<span class="pill good" style="font-size:14px;padding:6px 14px">Completed ✓</span>` : `<span style="color:var(--soft);font-size:14px">Answer the quick check to complete this lesson.</span>`}<button class="btn quiet" data-go="${nx}">${nx===K+'-wrap'?'Finish: watch the wrap-up':'Next: '+esc(P.title(nx))}</button></div></div></div>`;
}
function mrvSeen(h){ const P = mrvOf(h); if (P && h.startsWith(P.key+'-intro-')) { P.seen.add(h.slice(P.key.length+7)); P.save(); } }
function mrvWire(h){
  const P = mrvOf(h); if (!P) return;
  const v = $('.vwrap video'); if (v) v.addEventListener('ended', () => mrvSeen(h));
  const quiz = $('#mquiz'); if (!quiz) return; const l = P.all.find(x=>x.id===h.slice(P.key.length+3));
  quiz.onclick = e => { const b = e.target.closest('[data-mopt]'); if (!b) return; const k = +b.dataset.mopt, ok = k===l.q.a;
    quiz.querySelectorAll('[data-mopt]').forEach(x=>x.classList.remove('right','wrong')); b.classList.add(ok?'right':'wrong');
    $('#mwhy').textContent = ok ? 'Correct. ' + l.q.why : 'Not quite. Try again.';
    if (ok && !P.done.has(l.id)) { P.done.add(l.id); P.save(); const y = window.scrollY; render(); window.scrollTo(0, y); const q2 = $('#mquiz'); if (q2) { q2.querySelectorAll('[data-mopt]')[k].classList.add('right'); $('#mwhy').textContent = 'Correct. ' + l.q.why + ' Lesson complete.'; } } };
}

function render(){
  stopPlayer(); fillViewAs();
  let h = (location.hash||'#home').slice(1);
  if (h==='team' && !isAdmin()) h = 'home';
  if (who==='agent' && !mrvOf(h)) h = 'home';
  const v = mrvOf(h) ? mrvView(h) : h.startsWith('lesson-') ? lesson(h.slice(7)) : h.startsWith('intro-') ? intro(h.slice(6)) : h==='wrap' ? wrapup() : ({home, path, team, how, 'in-app':inapp}[h] || home)();
  $('#view').innerHTML = v; nav();
  if (h.startsWith('lesson-')) wireLesson(h.slice(7));
  wireNext(); if (mrvOf(h)) mrvWire(h);
  const f = $('#inv');
  if (f) f.onsubmit = e => { e.preventDefault();
    const cs = [...f.querySelectorAll('[name=camp]:checked')].map(x=>x.value); if (!cs.length) { $('#iv-msg').style.color='var(--bad)'; $('#iv-msg').textContent='Pick at least one campus.'; return; }
    lastInvite = {first:$('#iv-first').value.trim(), last:$('#iv-last').value.trim(), name:($('#iv-first').value.trim()+' '+$('#iv-last').value.trim()).trim(), email:$('#iv-email').value.trim(), role:$('#iv-role').value, campuses:$('#iv-role').value==='Admin'?['All']:cs, path:$('#iv-path').value, due:$('#iv-due').value, pw:$('#iv-pw').value.trim(), status:'Invited', sent:'today'};
    invites.push(lastInvite); render(); };
  window.scrollTo(0,0);
}
document.addEventListener('click', e => {
  const nb = e.target.closest('[data-next]'); if (nb) { const ch = (location.hash||'').slice(1); if (ch.startsWith('intro-')) { seen.add(ch.slice(6)); saveSeen(); } mrvSeen(ch); autoplayNext = true; go(nb.dataset.next); return; }
  const mb = e.target.closest('[data-mode]'); if (mb) { mode = mb.dataset.mode; const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  const sb = e.target.closest('[data-screen]'); if (sb) { inScreen = sb.dataset.screen; render(); return; }
  if (e.target.closest('#iv-gen')) { $('#iv-pw').value = tempPw(); return; }
  const rs = e.target.closest('[data-reset]'); if (rs) { $('#um-msg').textContent = `New temporary password for ${rs.dataset.reset}: ${tempPw()}. They must change it at their next sign-in.`; return; }
  const rm = e.target.closest('[data-remove]'); if (rm) { invites[+rm.dataset.remove].removed = true; if (lastInvite && lastInvite.removed) lastInvite = null; const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  if (e.target.closest('[data-class]')) { $('#cl-msg').textContent = 'In the real Academy this opens: pick the people, the path, the dates and the trainer.'; return; }
  const rb = e.target.closest('[data-remind]'); if (rb) { rb.textContent = 'Reminder queued'; rb.disabled = true; return; }
  const b = e.target.closest('[data-go]'); if (b && !b.disabled) go(b.dataset.go); });
$('#viewas').onchange = e => { who = e.target.value; render(); };
window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
